[package]
name = "basildisk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std"] }
async_zip = { version = "0.0.18", features = ["deflate64", "full", "tokio", "tokio-fs", "tokio-util"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["async-read-body", "cookie", "form"] }
base64 = "0.22.1"
futures-lite = "2.6.1"
mime = "0.3.17"
minijinja = "2.21.0"
minijinja-embed = "2.21.0"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "uuid"] }
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }
yasna = { version = "0.6.0", features = ["std", "time"] }

[build-dependencies]
minijinja-embed = "2.21.0"
